phase: 12
hypothesis: null   # 12 (taille du reseau), not in the original H1-H9 plan

regime: pushforward
M_BACK: 3
N_FWD: 2
features: [U]
LAMBDA_PHYSICS: 0

# "aucune couche cachee" -- models/mlp.py's MLP with an empty HIDDEN_SIZES
# is just nn.Linear(n_inputs, n_outputs), no activation: a plain linear map,
# trained the same way (Adam + MSE) as every other run here. NOTE: this is
# NOT literally Ridge regression -- there's no L2 penalty/weight_decay
# anywhere in this codebase's optimizer setup (see training/pushforward.py's
# torch.optim.Adam call). "Ridge" is this table's informal name for
# "smallest possible linear baseline"; add weight_decay to LEARNING_RATE's
# optimizer call if actual L2-penalized regression is what's wanted instead.
HIDDEN_SIZES: []
