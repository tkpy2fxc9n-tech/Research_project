[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beamsurrogate"
version = "0.1.0"
description = "Autoregressive stencil MLP/CNN surrogate for 1D elastic wave propagation in a beam"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "pandas",
    "h5py",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
xlsx = ["openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]
