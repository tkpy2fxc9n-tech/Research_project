inherit: phase2
run_id: p11_coarse_r2
phase: 11
hypothesis: null   # 11a (grille grossiere), not in the original H1-H9 plan

# Same settled architecture/training hyperparameters as p7_dataset_complex/
# p7_dataset_medium (M_BACK/N_FWD/features from H2-H4, regime from H5) --
# ASSUMPTION: this is "le modele final de l'etape 10" the r1 reference row
# reuses. Adjust here if étape 10 actually settled on something else
# (e.g. a different HIDDEN_SIZES from an 11b winner, or a different
# LAMBDA_PHYSICS from H6) -- this file was written before those are known.
regime: pushforward
M_BACK: 3
N_FWD: 2
features: [U]
LAMBDA_PHYSICS: 0

# The only axis this run actually varies: r=2 grid coarsening (dx x2.02,
# dt x2 -- see scripts/make_coarse_dataset.py for why dx isn't exactly x2).
# Nx/Nt override the phase2/base defaults (100/500); everything else
# (SS=11, M_BACK/N_FWD/ndt as raw-step counts, AMP/OMEGA/SIGMA ranges) is
# held fixed on purpose -- this study's whole point is "same architecture,
# coarser grid", not a re-tuned one.
Nx: 50
Nt: 250
dataset: simple_coarse_r2   # fine solution, subsampled -- NOT a fresh FD run
                             # at coarse resolution. Mandatory comparison
                             # against a solver run natively on this SAME
                             # coarse grid happens separately at eval time
                             # (run_fd_simulation_general with this cfg),
                             # not against the fine-grid FD reference.
