# Reference config for the whole campaign. Every configs/runs/*.yaml (and,
# from phase 3 onward, every configs/retained/*.yaml) states only its DIFF
# from this file via `inherit: base` -- see src/beamsurrogate/config.py's
# load_config(). Never edit a run's copy of these values; change the run's
# YAML instead.

# --- architecture / windowing ------------------------------------------
model: mlp
SS: 11
M_BACK: 2
N_FWD: 3
ndt: 2
features: [U]
output: delta_u

# --- training regime + stabilizer (held fixed until phases 2 and 5) ----
regime: teacher_forcing
stabilizer: none

# --- dataset (held fixed until phase 6) ---------------------------------
dataset: simple

# --- optimization --------------------------------------------------------
N_EPOCHS: 100
BATCH_SIZE: 64
LEARNING_RATE: 0.001
EARLY_STOP_PATIENCE: 15

# --- reproducibility -----------------------------------------------------
SEED: 42
SPLIT_SEED: 42
